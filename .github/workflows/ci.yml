name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: bash scripts/ci-check.sh

  firmware:
    # The leg firmware (firmware/leg-esp32, Issue #54) built for the ESP32-S3 with ESP-IDF, without and with the
    # embedded policy (empty stand-in files: this checks that it compiles; running it needs the hardware).
    name: firmware (esp32s3)
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5
    steps:
      - uses: actions/checkout@v4
      - name: Build without a policy
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd firmware/leg-esp32
          idf.py set-target esp32s3
          idf.py build
      - name: Build with the policy embedded
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd firmware/leg-esp32
          mkdir -p main/embed
          touch main/embed/mlp_actor.wasm main/embed/policy.dynm main/embed/check.bin
          echo "CONFIG_ERG_EMBED_POLICY=y" > ../embed.defaults
          rm -rf build sdkconfig
          idf.py -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;../embed.defaults" set-target esp32s3
          idf.py -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;../embed.defaults" build
