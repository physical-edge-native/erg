[project]
name = "erg"
version = "0.0.0"
description = "Split (per-leg) versus central control of a cheap four-legged robot, built on Dyne"
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "numpy",
    "mujoco",
    "torch",
    "onnx",
    "onnxruntime",
    "wasmtime",
]

[project.optional-dependencies]
bench = [
    "pyserial>=3.5",
]

[dependency-groups]
dev = ["pytest", "build123d"]

[tool.uv]
package = false

# CPU-only PyTorch everywhere (no GPU is assumed). macOS wheels on PyPI are CPU-only already.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
